name: CI

# This is the engine's own gate. It has no consuming repo to check against, so
# what it verifies is narrower and different in kind: that the engine is
# internally consistent (lint, types), that it holds under its own documented
# failure modes (gate-fixture, run against a throwaway repo), and that it
# carries no coupling to the one repo it was extracted from (no-repo-refs).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · unit · coupling · init · paths · decisions · agents · skill · gate · trace · hooks · cold-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # This is shell-lint's replacement: once every hook is .mjs there is no
      # .sh left to shellcheck, and plain type-checking over the engine's own
      # source does the same job — catching what a behaviour fixture cannot,
      # because a source that fails at runtime is not what tsc looks for
      # either, but a wrong argument count or a typo'd property name is.
      - name: Typecheck
        run: npm run typecheck

      # The pure functions that read an argv the contract declares. Every
      # other check here builds a throwaway repo to reach behaviour, which is
      # the right shape for behaviour and a poor one for a total function over
      # a string array: the defect that motivated this — the binary of
      # `["eslint", "."]` resolving to `"."` — costs one line to state here and
      # a repo, a git history and a full generator run to reach anywhere else.
      # It also covers the shim branch that production only reaches on the
      # platform this workflow does not run (ADR-011).
      - name: Unit tests
        run: npm run unit:check

      # The reversed arrow, made checkable — see the file's own header for
      # what it bans and why the archive check is narrower than a path ban.
      - name: No repo-specific coupling
        run: npm run check

      # `init` generates a consuming repo's contract, which is what a worked
      # example file used to do worse: an example is a static artifact nothing
      # executes, so a contract change leaves it silently wrong. This asserts
      # the generator's actual claim — that what it writes VALIDATES through
      # the same reader every hook uses — so that change turns CI red instead.
      - name: init behaviour
        run: npm run init:check

      # Every ${CLAUDE_PLUGIN_ROOT}/... path the commands, agents and
      # hooks.json tell someone to run must exist in the package. A command
      # naming a script that does not ship is an instruction that silently
      # never executes — see the script's own header for the run-telemetry
      # step that spent a while in exactly that state.
      - name: Plugin paths resolve
        run: npm run paths:check

      # A decision record and the code it governs must reach each other. This
      # is what separates decisions/ from a docs tree nobody reads: a citation
      # that resolves to nothing, and a record nothing cites, both fail. See
      # decisions/README.md for why a dated record does not rot the way this
      # repo's last standalone document did.
      - name: Decisions are reachable from the code
        run: npm run decisions:check

      # The only check over the PROSE half of this plugin. The agents and
      # commands are Markdown that no fixture executes, and the failure this
      # closes has already happened: a field was added to the planner's
      # milestone template and the reviewer was never told, so a milestone
      # missing it passed review unseen.
      - name: Agent contracts agree
        run: npm run agents:check

      # The setup skill is prose a model acts on, with no compiler behind it:
      # it names entrypoints, the buckets it tells the model to read in init's
      # output, and the contract fields to fill. Rename any of those and the
      # skill still reads correctly while sending the model after a word
      # nothing prints. The last case holds the engine to failing LOUDLY on a
      # wrong reporter flag, which is what makes the model's judgement here
      # survivable — see ADR-006.
      - name: Setup skill agrees with the engine
        run: npm run skill:check

      # Builds throwaway repos, installs the engine at a SEPARATE path (the
      # way it actually ships), and asserts the gate's documented behaviour
      # holds — including the split this whole extraction exists to make
      # correct. git is preinstalled on the runner; nothing else is required.
      - name: Gate behaviour
        run: npm run gate:check

      # spec-trace is the check that makes specs/ authoritative rather than
      # decorative, and it is ~270 lines of regex that the gate fixture
      # deliberately stubs out. This runs the real one against throwaway
      # repos: both directions of the requirement/proof binding, and the
      # rule that a test which does not RUN (skip/todo/xit) is not proof.
      - name: spec-trace behaviour
        run: npm run trace:check

      # The report readers, against captures from real emitters rather than
      # XML written to match the parser. What it defends is one property:
      # a test the report marks as skipped must reach spec-trace as absent,
      # in every format, or skipping silences the check that exists to stop
      # exactly that.
      - name: test-report readers
        run: npm run report:check

      # The session-reuse numbers in the stats report. The case that carries
      # the design is the cross-milestone one: counting repeated reads over a
      # whole run is the obvious implementation and it reports the EXPECTED
      # case — a fresh session per milestone — as waste.
      - name: stats report
        run: npm run stats:check

      # The other nine hooks. Shallower than the gate fixture, and that is
      # the right trade: they are nine small adapters over one protocol, and
      # what a port breaks in them is coarse — a hook that crashes, or fires
      # when it should be transparent.
      - name: Hook behaviour
        run: npm run hooks:check

      # The only check that fails when ADOPTION breaks. Every step above tests
      # a piece of the engine; this takes a Node repo from nothing to a green
      # `spec-flow check` through the route the README documents, and asserts
      # the front page's strongest claim — that `init` appends the reporter
      # flag rather than describing it.
      #
      # It installs NOTHING: the suite is `node --test`, which ships with the
      # Node this workflow already sets up and emits JUnit XML behind a flag.
      # The report is therefore written by a real runner, which is the property
      # this check lost once before — a hand-written one spelled an id no
      # runner could produce, and a passing test reading as absent went
      # unnoticed here.
      - name: Cold start (a Node repo, from nothing to green)
        run: npm run cold:check

      # `files` in package.json is evaluated nowhere but `npm pack`, so a module
      # dropped from it passes every check above and fails on the first
      # `npx spec-flow init` in somebody's project. This packs the tarball,
      # installs it into a throwaway repo as a real devDependency, and drives
      # the documented CLI route through the installed bin. It is the only step
      # here that needs the network.
      - name: The published package works
        run: npm run pack:check
