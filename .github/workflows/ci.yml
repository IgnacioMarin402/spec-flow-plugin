name: CI

# The engine's own gate. It has no consuming repo to check against, so what it
# verifies is that the engine holds under its documented failure modes (each
# case builds a throwaway repo and runs the real binary), that the binaries
# committed in bin/ are the source beside them, and that this repo's prose and
# code still agree with each other (internal/repocheck).

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository or its pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: go · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows too: hooks.json, a spawn with no shell and every `\`-vs-`/`
    # assumption live exactly where a POSIX-only matrix cannot see them, and
    # Windows runs bin/spec-flow.exe where the others run the launcher.
    # `fail-fast: false`: one red leg is a portability fact, not a reason to
    # discard the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The release go.mod names: the committed binaries are what that release
      # builds, byte for byte (internal/build).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatted
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Everything: the engine's behaviour, the binaries' freshness, and the
      # repository's checks on itself. The cases that run an adopter's Node
      # repository use the runner's own node, and skip where there is none.
      - name: Tests
        run: go test ./...

  # The live view is a mod: Claude Code loads it, so its only runner is Claude
  # Code's own kit. The newest release, because a release of the early-access
  # API is what breaks a mod; no credentials, which the kit does not need. Both
  # OS legs: the kit spells a path the platform's way. See ADR-037.
  live-view:
    name: live view · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install the newest Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the newest Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Recorded, not checked (ADR-004): a red run names the release that broke it.
      - name: Claude Code version
        run: claude --version

      # Named by its manifest: at the root, validate reads the marketplace
      # file instead and never reaches hooks.json or the module.
      - name: The module validates against its contract
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Live view behaviour
        run: claude plugin test .
