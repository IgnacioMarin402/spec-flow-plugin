[package]
name = "spec-flow"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "spec-flow"
path = "engine/main.rs"

[features]
# The gate's tests build a copy whose unscoped checks panic, to hold its
# fail-closed handler to a real throw. Never in a shipped binary.
gatecrash = []

[dependencies]
regex = "1"
# ECMAScript patterns: lookaround, and JavaScript's line terminators (ADR-054).
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# What the committed binaries are built with: every byte depends on it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# A hook that crashes is caught and answered by its own protocol, so a panic
# must unwind to the runner, not abort the process.
panic = "unwind"

[[test]]
name = "binaries"
path = "engine/tests/binaries.rs"
